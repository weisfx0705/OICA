<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靈曦籤苑 - ISU Thai-Taiwan Oracle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Ma+Shan+Zheng&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'noto sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
            background-color: #0f172a;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .font-calligraphy {
            font-family: 'Ma Shan Zheng', cursive;
        }

        .sacred-glow {
            box-shadow:
                0 0 60px rgba(251, 191, 36, 0.18),
                0 0 120px rgba(168, 85, 247, 0.12),
                0 0 160px rgba(236, 72, 153, 0.08);
        }

        .mystic-gradient {
            background:
                radial-gradient(1200px 600px at 10% 0%, rgba(139, 92, 246, 0.25) 0%, transparent 60%),
                radial-gradient(900px 500px at 90% 10%, rgba(236, 72, 153, 0.22) 0%, transparent 60%),
                radial-gradient(800px 500px at 80% 90%, rgba(251, 191, 36, 0.22) 0%, transparent 60%),
                radial-gradient(900px 600px at 10% 100%, rgba(34, 211, 238, 0.22) 0%, transparent 60%),
                radial-gradient(700px 400px at 50% 50%, rgba(52, 211, 153, 0.12) 0%, transparent 70%),
                linear-gradient(180deg, #0a0a1f 0%, #120826 40%, #0f172a 100%);
            background-attachment: fixed;
        }

        .rainbow-text {
            background-image: linear-gradient(90deg, #fbbf24, #f472b6, #a78bfa, #22d3ee, #34d399, #fbbf24);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow-shift 8s linear infinite;
            filter: drop-shadow(0 2px 12px rgba(251, 191, 36, 0.4));
        }

        @keyframes rainbow-shift {
            to { background-position: 200% center; }
        }

        .rainbow-border {
            position: relative;
        }
        .rainbow-border::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(130deg, #fbbf24, #f472b6, #a78bfa, #22d3ee, #34d399);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.8;
            pointer-events: none;
        }

        .rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .drop {
            position: absolute;
            width: 1.5px;
            height: 90px;
            animation: fall linear infinite;
            border-radius: 999px;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }

        .interpretation-content h1,
        .interpretation-content h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fbbf24;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            border-left: 4px solid #fbbf24;
            padding-left: 0.75rem;
        }

        .interpretation-content h3 {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fde68a;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            letter-spacing: 0.03em;
        }

        .interpretation-content p {
            margin-bottom: 1rem;
            line-height: 1.8;
        }

        .interpretation-content strong {
            color: #fcd34d;
        }
    </style>
    <script type="module" src="/index.tsx"></script>
</head>

<body class="mystic-gradient min-h-screen">
    <div class="rain" id="rain-container"></div>
    <div id="root" class="relative z-10"></div>
    <script>
        const container = document.getElementById('rain-container');
        const dropCount = 70;
        const palette = [
            'rgba(251, 191, 36, 0.55)',
            'rgba(244, 114, 182, 0.55)',
            'rgba(167, 139, 250, 0.55)',
            'rgba(34, 211, 238, 0.55)',
            'rgba(52, 211, 153, 0.55)',
            'rgba(255, 255, 255, 0.45)'
        ];
        for (let i = 0; i < dropCount; i++) {
            const drop = document.createElement('div');
            drop.className = 'drop';
            const color = palette[Math.floor(Math.random() * palette.length)];
            drop.style.background = `linear-gradient(to bottom, rgba(255,255,255,0) 0%, ${color} 100%)`;
            drop.style.boxShadow = `0 0 6px ${color}`;
            drop.style.left = Math.random() * 100 + 'vw';
            drop.style.animationDuration = (Math.random() * 1.2 + 0.6) + 's';
            drop.style.animationDelay = Math.random() * 2 + 's';
            drop.style.opacity = (Math.random() * 0.4 + 0.2).toString();
            container.appendChild(drop);
        }
    </script>
</body>

</html>
