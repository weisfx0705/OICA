<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一志願面試籤 - ISU Interview Oracle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #07111f;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        h1,
        h2,
        .font-serif {
            font-family: 'Cormorant Garamond', 'Noto Sans TC', serif;
        }

        .mystic-gradient {
            background:
                radial-gradient(1200px 700px at 0% 0%, rgba(34, 211, 238, 0.14) 0%, transparent 58%),
                radial-gradient(1000px 620px at 100% 0%, rgba(251, 191, 36, 0.14) 0%, transparent 55%),
                radial-gradient(900px 520px at 70% 100%, rgba(251, 113, 133, 0.12) 0%, transparent 58%),
                linear-gradient(180deg, #050b16 0%, #0b1324 38%, #0f172a 100%);
            background-attachment: fixed;
        }

        .interpretation-content h1,
        .interpretation-content h2 {
            font-size: 1.25rem;
            font-weight: 800;
            color: #7dd3fc;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            border-left: 4px solid #7dd3fc;
            padding-left: 0.75rem;
        }

        .interpretation-content h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fde68a;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            letter-spacing: 0.03em;
        }

        .interpretation-content p {
            margin-bottom: 1rem;
            line-height: 1.8;
        }

        .interpretation-content strong {
            color: #f8fafc;
        }
    </style>
    <script type="module" src="/index2.tsx"></script>
</head>

<body class="mystic-gradient min-h-screen">
    <div id="root" class="relative z-10"></div>
</body>

</html>
