body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(circle at 52% 26%, rgba(255,255,255,.70), transparent 34%),
    linear-gradient(90deg, rgba(251,242,228,.92), rgba(251,242,228,.64) 45%, rgba(251,242,228,.88));
  pointer-events: none;
}
button, input { font: inherit; }
.app { min-height: 100vh; }
.shell {
  width: min(1180px, calc(100vw - 32px));
  margin: 0 auto;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 22px 0 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  color: #5f3f32;
  font-weight: 700;
  letter-spacing: 0;
}
.logo-mark {
  width: 180px;
  max-width: 38vw;
  height: auto;
  display: block;
  object-fit: contain;
  filter: drop-shadow(0 8px 18px rgba(70, 45, 30, .10));
}
.brand-text {
  padding-left: 2px;
  border-left: 1px solid rgba(95, 63, 50, .24);
  padding-left: 14px;
  line-height: 1.45;
}
.stats {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}
.stat {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 12px;
  background: rgba(255,255,255,.38);
  color: #5b4c42;
  font-size: 14px;
}
.hero {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 34px;
  align-items: end;
  min-height: 430px;
  padding: 46px 28px 32px;
  margin: 8px 0 14px;
  overflow: hidden;
  border: 1px solid rgba(87, 66, 52, .16);
  box-shadow: 0 24px 62px rgba(50, 35, 23, .18);
  background-image:
    linear-gradient(90deg, rgba(251,242,228,.96) 0%, rgba(251,242,228,.86) 34%, rgba(251,242,228,.42) 61%, rgba(251,242,228,.18) 100%),
    linear-gradient(0deg, rgba(29, 23, 18, .12), rgba(29, 23, 18, .04)),
    url("group_photo.jpg");
  background-size: cover;
  background-position: center 42%;
}
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 26% 46%, rgba(255,255,255,.42), transparent 32%),
    linear-gradient(180deg, rgba(255,255,255,.10), rgba(251,242,228,.42));
  pointer-events: none;
}
.hero > * {
  position: relative;
  z-index: 1;
}
h1 {
  font-size: clamp(40px, 5.6vw, 72px);
  line-height: .98;
  margin: 0;
  max-width: 930px;
  font-weight: 900;
  letter-spacing: 0;
}
h1 .line { display: block; }
h1 .nowrap { white-space: nowrap; }
.subtitle {
  margin: 14px 0 0;
  max-width: 720px;
  color: #68584b;
  font-size: clamp(17px, 2vw, 23px);
  line-height: 1.7;
}
.dedication {
  border-left: 5px solid var(--red);
  padding: 14px 0 14px 18px;
  color: #5b473d;
  font-size: 18px;
  line-height: 1.65;
  background: linear-gradient(90deg, rgba(255,255,255,.36), transparent);
}
.section-tabs {
  display: inline-flex;
  gap: 8px;
  padding: 7px;
  margin: 0 0 18px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255,255,255,.42);
  box-shadow: 0 10px 28px rgba(70, 48, 32, .08);
}
.tab-button {
  border: 0;
  border-radius: 999px;
  padding: 10px 16px;
  color: #514238;
  background: transparent;
  cursor: pointer;
  font-weight: 800;
  transition: background .18s ease, color .18s ease, transform .18s ease;
}
.tab-button:hover { transform: translateY(-1px); }
.tab-button.active {
  color: #fff8ef;
  background: #302622;
}
.controls-band {
  border-block: 1px solid var(--line);
  background: rgba(255,250,241,.52);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 20;
}
.controls {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr minmax(180px, .85fr);
  gap: 12px;
  padding: 10px 0;
}
.control-group {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.control-label {
  color: #725c50;
  font-size: 13px;
  white-space: nowrap;
}
.segments {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.segment {
  border: 1px solid rgba(95, 70, 50, .22);
  background: rgba(255,255,255,.45);
  color: #4e4139;
  padding: 8px 11px;
  min-height: 36px;
  border-radius: 999px;
  cursor: pointer;
  transition: transform .18s ease, background .18s ease, border-color .18s ease;
}
.segment:hover { transform: translateY(-1px); }
.segment.active {
  background: #302622;
  color: #fff8ef;
  border-color: #302622;
}
.search {
  width: 100%;
  border: 1px solid rgba(95, 70, 50, .22);
  min-height: 38px;
  border-radius: 999px;
  padding: 8px 13px;
  color: var(--ink);
  background: rgba(255,255,255,.62);
}
.main-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 28px;
  padding: 30px 0 54px;
  align-items: start;
}
.cloud-wrap {
  min-height: 700px;
  position: relative;
  border: 1px solid var(--line);
  background:
    radial-gradient(circle at 50% 48%, rgba(255,255,255,.66), transparent 42%),
    linear-gradient(135deg, rgba(255,255,255,.33), rgba(255,250,241,.13));
  box-shadow: var(--shadow);
  overflow: hidden;
}
.cloud-wrap::before {
  content: "";
  position: absolute;
  inset: 26px;
  border: 1px dashed rgba(113, 91, 72, .22);
  border-radius: 50%;
  pointer-events: none;
}
#cloud {
  position: relative;
  min-height: 700px;
  isolation: isolate;
}
.word {
  position: absolute;
  left: var(--x);
  top: var(--y);
  transform: translate(-50%, -50%) rotate(var(--rot));
  border: 0;
  background: transparent;
  color: var(--word-color);
  font-weight: 900;
  font-size: var(--size);
  line-height: 1;
  letter-spacing: 0;
  cursor: pointer;
  text-shadow: 0 1px 0 rgba(255,255,255,.88), 0 9px 24px rgba(58, 38, 27, .15);
  padding: 9px 10px;
  border-radius: 999px;
  max-width: 92%;
  transition: transform .2s ease, filter .2s ease, background .2s ease;
  animation: bloom .75s cubic-bezier(.18,.9,.22,1) both;
  animation-delay: var(--delay);
}
.word.kind-teacher {
  background: rgba(255, 252, 244, .42);
  box-shadow: 0 8px 24px rgba(122, 77, 54, .10);
}
.word.kind-message {
  font-weight: 760;
  padding: 5px 6px;
  opacity: .86;
  text-shadow: 0 1px 0 rgba(255,255,255,.78), 0 6px 14px rgba(58, 38, 27, .10);
}
.word::after {
  content: attr(data-count);
  position: absolute;
  right: -5px;
  top: -8px;
  min-width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 800;
  color: #fffaf0;
  background: var(--badge);
  border-radius: 999px;
  box-shadow: 0 8px 18px rgba(54, 36, 24, .2);
}
.word.kind-message::after {
  display: none;
}
.word:hover, .word.active {
  transform: translate(-50%, -50%) rotate(0deg) scale(1.08);
  background: rgba(255,255,255,.50);
  filter: saturate(1.16);
  z-index: 4;
}
@keyframes bloom {
  from { opacity: 0; transform: translate(-50%, -42%) rotate(var(--rot)) scale(.7); }
  to { opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot)) scale(1); }
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 14px 18px 0;
}
.legend span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,.50);
  color: #58473e;
  font-size: 13px;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: currentColor;
}
.dot.female { color: var(--red); }
.dot.male { color: var(--teal); }
.dot.mixed { color: var(--gold); }
.side {
  position: sticky;
  top: 84px;
  display: grid;
  gap: 16px;
}
.panel {
  border: 1px solid var(--line);
  background: rgba(255,251,244,.78);
  box-shadow: var(--shadow);
  padding: 20px;
}
.panel h2 {
  margin: 0 0 8px;
  font-size: 25px;
  letter-spacing: 0;
}
.panel .meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 12px 0 0;
}
.badge {
  border: 1px solid rgba(87, 66, 52, .18);
  background: rgba(255,255,255,.58);
  padding: 6px 9px;
  border-radius: 999px;
  color: #5d5047;
  font-size: 13px;
}
.quote-list {
  display: grid;
  gap: 12px;
  max-height: 520px;
  overflow: auto;
  padding-right: 3px;
}
.quote-card {
  border: 1px solid rgba(87, 66, 52, .14);
  background: rgba(255,255,255,.62);
  padding: 15px;
  border-radius: 8px;
}
.quote-text {
  font-size: 17px;
  line-height: 1.72;
  white-space: pre-wrap;
}
.translation-box {
  margin-top: 12px;
  padding: 12px 13px;
  border-left: 4px solid rgba(15, 140, 134, .55);
  background: rgba(244, 252, 249, .72);
  color: #31564f;
}
.translation-label {
  margin-bottom: 4px;
  color: #0f7772;
  font-size: 12px;
  font-weight: 900;
}
.translation-text {
  font-size: 16px;
  line-height: 1.7;
  white-space: pre-wrap;
}
.quote-meta {
  margin-top: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.message-band {
  border-top: 1px solid var(--line);
  background: rgba(255,249,238,.65);
  padding: 42px 0 68px;
}
.section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 18px;
}
.section-head h2 {
  margin: 0;
  font-size: clamp(30px, 4vw, 48px);
}
.count-note {
  color: var(--muted);
  font-size: 15px;
}
.message-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.footer {
  border-top: 1px solid var(--line);
  padding: 22px 0 36px;
  color: #6e5c4f;
  font-size: 14px;
}
.empty {
  padding: 40px;
  color: var(--muted);
}
@media (max-width: 980px) {
  .hero, .main-grid { grid-template-columns: 1fr; }
  .hero {
    min-height: 520px;
    align-items: end;
    background-image:
      linear-gradient(180deg, rgba(251,242,228,.94) 0%, rgba(251,242,228,.74) 44%, rgba(251,242,228,.30) 100%),
      linear-gradient(0deg, rgba(29, 23, 18, .10), rgba(29, 23, 18, .04)),
      url("group_photo.jpg");
    background-position: center bottom;
  }
  .dedication { max-width: 680px; }
  .controls { grid-template-columns: 1fr 1fr; }
  .side { position: static; }
  .message-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 680px) {
  .shell { width: min(100vw - 22px, 1180px); }
  .topbar { align-items: flex-start; flex-direction: column; }
  .logo-mark { width: 156px; max-width: 72vw; }
  .brand { align-items: flex-start; flex-direction: column; gap: 8px; }
  .brand-text { border-left: 0; padding-left: 0; }
  .hero { min-height: 560px; padding: 28px 18px 24px; }
  .controls { grid-template-columns: 1fr; }
  .cloud-wrap, #cloud { min-height: 620px; }
  .message-grid { grid-template-columns: 1fr; }
  .section-head { align-items: flex-start; flex-direction: column; }
  .word { max-width: 78vw; white-space: normal; text-align: center; }
}
</style>
</head>

<span class=\"line nowrap\">師生座談會</span>", "heroSubtitle": "這一頁收集學生寫給未來的願望：通過 TOCFL、中文更好、順利畢業、找到好工作，也把在台灣繼續發光的期待放進文字雲。", "dedication": "老師們的陪伴，會變成學生往前走時心裡的一盞燈。這些期許，也是一份給教育現場的回聲。", "messageTitle": "學生寫給未來的話", "searchPlaceholder": "搜尋 TOCFL、畢業、工作、中文", "statLabel": "期許", "detailLabel": "期許文字", "emptyTitle": "學生的期許"}}};
const state = { section: "teacher", classKey: "all", genderKey: "all", nationKey: "all", search: "", selectedTerm: null };

const colors = {
  female: { text: "#c94f5f", badge: "#b63f52" },
  male: { text: "#0f8c86", badge: "#0d7772" },
  mixed: { text: "#b88923", badge: "#a27314" },
  unknown: { text: "#536f9e", badge: "#536f9e" }
};

function matchesFilters(record) {
  if (state.classKey !== "all" && record.classKey !== state.classKey) return false;
  if (state.genderKey !== "all" && record.genderKey !== state.genderKey) return false;
  if (state.nationKey !== "all" && record.nationKey !== state.nationKey) return false;
  if (state.search.trim()) {
    const q = state.search.trim().toLowerCase();
    const hay = `${record.message} ${record.translation || ""} ${record.classLabel} ${record.genderLabel} ${record.nationLabel}`.toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function currentSection() {
  return DATA.sections[state.section];
}

function filteredRecords() {
  return currentSection().records.filter(matchesFilters);
}

function recordsByIds(ids) {
  const allowed = new Set(ids);
  return currentSection().records.filter(record => allowed.has(record.id) && matchesFilters(record));
}

function filteredWords() {
  return currentSection().words.map(word => {
    const records = recordsByIds(word.recordIds);
    const genders = records.reduce((acc, record) => {
      acc[record.genderKey] = (acc[record.genderKey] || 0) + 1;
      return acc;
    }, {});
    let gender = Object.entries(genders).sort((a, b) => b[1] - a[1])[0]?.[0] || word.gender || "unknown";
    const values = Object.values(genders);
    if (values.length > 1 && values[0] === values[1]) gender = "mixed";
    return { ...word, filteredCount: records.length, filteredRecords: records, filteredGender: gender };
  }).filter(word => word.filteredCount > 0).sort((a, b) => {
    const rank = { teacher: 0, theme: 1, message: 2 };
    const rankDiff = (rank[a.kind] ?? 9) - (rank[b.kind] ?? 9);
    if (rankDiff) return rankDiff;
    return b.filteredCount - a.filteredCount || a.term.localeCompare(b.term, "zh-Hant");
  });
}

function polarPosition(index, total) {
  const angle = index * 2.399963229728653 + (total % 6) * .21;
  const ring = Math.sqrt((index + 1.8) / Math.max(total + 2, 1));
  const wobble = 1 + ((index % 5) - 2) * .025;
  const x = 50 + Math.cos(angle) * ring * 45 * wobble;
  const y = 47 + Math.sin(angle) * ring * 39 * wobble;
  return [Math.max(7, Math.min(93, x)), Math.max(10, Math.min(88, y))];
}

function classSummary(records) {
  const counts = records.reduce((acc, record) => {
    acc[record.classLabel] = (acc[record.classLabel] || 0) + 1;
    return acc;
  }, {});
  return Object.entries(counts).map(([label, count]) => `${label} ${count}`).join(" · ");
}

function genderSummary(records) {
  const counts = records.reduce((acc, record) => {
    acc[record.genderLabel] = (acc[record.genderLabel] || 0) + 1;
    return acc;
  }, {});
  return Object.entries(counts).map(([label, count]) => `${label} ${count}`).join(" · ");
}

function nationSummary(records) {
  const counts = records.reduce((acc, record) => {
    acc[record.nationLabel] = (acc[record.nationLabel] || 0) + 1;
    return acc;
  }, {});
  return Object.entries(counts).map(([label, count]) => `${label} ${count}`).join(" · ");
}

function renderCloud() {
  const cloud = document.querySelector("#cloud");
  const words = filteredWords();
  const max = Math.max(...words.map(word => word.filteredCount), 1);
  cloud.innerHTML = "";
  if (!words.length) {
    cloud.innerHTML = `<div class="empty">目前篩選沒有可顯示的留言。</div>`;
    return;
  }
  const visibleWords = words.slice(0, 120);
  visibleWords.forEach((word, index) => {
    const [x, y] = polarPosition(index, visibleWords.length);
    const kindBase = word.kind === "teacher" ? 20 : word.kind === "message" ? 11 : 16;
    const kindSpread = word.kind === "teacher" ? 18 : word.kind === "message" ? 6 : 34;
    const size = kindBase + Math.pow(word.filteredCount / max, .68) * kindSpread;
    const color = colors[word.filteredGender] || colors.unknown;
    const button = document.createElement("button");
    button.type = "button";
    button.className = `word kind-${word.kind || "theme"}` + (state.selectedTerm === word.term ? " active" : "");
    button.textContent = word.term;
    button.dataset.count = word.filteredCount;
    button.style.setProperty("--x", `${x}%`);
    button.style.setProperty("--y", `${y}%`);
    button.style.setProperty("--size", `${size}px`);
    button.style.setProperty("--rot", `${((index % 7) - 3) * 3.5}deg`);
    button.style.setProperty("--delay", `${Math.min(index * 22, 520)}ms`);
    button.style.setProperty("--word-color", color.text);
    button.style.setProperty("--badge", color.badge);
    button.title = `${word.term}｜${word.filteredCount} 則｜${classSummary(word.filteredRecords)}｜${genderSummary(word.filteredRecords)}`;
    button.addEventListener("click", () => {
      state.selectedTerm = state.selectedTerm === word.term ? null : word.term;
      render();
      document.querySelector("#detailPanel").scrollIntoView({ block: "nearest", behavior: "smooth" });
    });
    cloud.appendChild(button);
  });
}

function badge(label) {
  return `<span class="badge">${label}</span>`;
}

function quoteCard(record) {
  const translation = record.translation
    ? `<div class="translation-box"><div class="translation-label">繁中翻譯</div><div class="translation-text">${escapeHtml(record.translation)}</div></div>`
    : "";
  return `<article class="quote-card">
    <div class="quote-text">${escapeHtml(record.message)}</div>
    ${translation}
    <div class="quote-meta">${badge(record.classLabel)}${badge(record.genderLabel)}${badge(record.nationLabel)}</div>
  </article>`;
}

function escapeHtml(text) {
  return text.replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
}

function renderDetail() {
  const panel = document.querySelector("#detailPanel");
  const words = filteredWords();
  const selected = state.selectedTerm ? words.find(word => word.term === state.selectedTerm) : words[0];
  if (!selected) {
    panel.innerHTML = `<h2>${escapeHtml(currentSection().emptyTitle)}</h2><p class="count-note">目前沒有符合條件的留言。</p>`;
    return;
  }
  const records = selected.filteredRecords;
  panel.innerHTML = `
    <h2>${escapeHtml(selected.term)}</h2>
    <div class="count-note">${records.length} 則${escapeHtml(currentSection().detailLabel)}</div>
    <div class="meta">
      ${badge(classSummary(records) || "全部班級")}
      ${badge(genderSummary(records) || "全部性別")}
      ${badge(nationSummary(records) || "全部國籍")}
    </div>
    <div style="height:14px"></div>
    <div class="quote-list">${records.map(quoteCard).join("")}</div>
  `;
}

function renderMessages() {
  const records = filteredRecords();
  document.querySelector("#messageCount").textContent = `${records.length} 則留言`;
  document.querySelector("#messageTitle").textContent = currentSection().messageTitle;
  document.querySelector("#messages").innerHTML = records.map(quoteCard).join("") || `<div class="empty">目前沒有符合條件的留言。</div>`;
}

function renderStats() {
  const records = filteredRecords();
  document.querySelector("#activeStats").innerHTML = `
    <span class="stat">${records.length} 則${escapeHtml(currentSection().statLabel)}</span>
    <span class="stat">${classSummary(records) || "全部班級"}</span>
    <span class="stat">${genderSummary(records) || "全部性別"}</span>
  `;
}

function setActiveButtons() {
  document.querySelectorAll("[data-section]").forEach(button => {
    button.classList.toggle("active", state.section === button.dataset.section);
  });
  document.querySelectorAll("[data-filter]").forEach(button => {
    const key = button.dataset.filter;
    const value = button.dataset.value;
    button.classList.toggle("active", state[key] === value);
  });
}

function renderHero() {
  const section = currentSection();
  document.querySelector("#heroTitle").innerHTML = section.heroTitle;
  document.querySelector("#heroSubtitle").textContent = section.heroSubtitle;
  document.querySelector("#dedication").textContent = section.dedication;
  document.querySelector("#search").placeholder = section.searchPlaceholder;
}

function render() {
  setActiveButtons();
  renderHero();
  renderStats();
  renderCloud();
  renderDetail();
  renderMessages();
}

document.querySelectorAll("[data-section]").forEach(button => {
  button.addEventListener("click", () => {
    state.section = button.dataset.section;
    state.selectedTerm = null;
    state.search = "";
    document.querySelector("#search").value = "";
    render();
  });
});
document.querySelectorAll("[data-filter]").forEach(button => {
  button.addEventListener("click", () => {
    state[button.dataset.filter] = button.dataset.value;
    state.selectedTerm = null;
    render();
  });
});
document.querySelector("#search").addEventListener("input", event => {
  state.search = event.target.value;
  state.selectedTerm = null;
  render();
});
render();
</script>
