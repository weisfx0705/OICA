<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISU Graduation Oracle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Cinzel:wght@500;700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --rose: #ff7aa2;
            --peach: #ffb86b;
            --sun: #ffe66d;
            --mint: #7cf2bd;
            --sky: #69d7ff;
            --lilac: #c69cff;
            --ink: #16211f;
            --cream: #fff7df;
        }

        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background-color: #11201d;
            color: var(--cream);
            overflow-x: hidden;
        }

        h1 {
            font-family: 'Cinzel', 'Source Serif 4', Georgia, serif;
        }

        h2,
        .font-black,
        button {
            font-family: 'Baloo 2', 'Source Serif 4', Georgia, serif;
        }

        .mystic-gradient {
            background:
                linear-gradient(115deg, rgba(255, 122, 162, 0.20), transparent 28%),
                linear-gradient(145deg, transparent 12%, rgba(255, 230, 109, 0.18) 26%, transparent 43%),
                linear-gradient(205deg, transparent 14%, rgba(105, 215, 255, 0.18) 33%, transparent 52%),
                linear-gradient(255deg, rgba(198, 156, 255, 0.18), transparent 34%),
                linear-gradient(180deg, #10231f 0%, #17362f 46%, #1b2a37 100%);
            background-attachment: fixed;
        }

        .mystic-gradient::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.22;
            background-image:
                linear-gradient(135deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(45deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: linear-gradient(to bottom, black, transparent 82%);
        }

        .rainbow-title {
            background: linear-gradient(90deg, var(--rose), var(--peach), var(--sun), var(--mint), var(--sky), var(--lilac), var(--rose));
            background-size: 220% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow-flow 9s linear infinite;
            filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.28));
        }

        .rainbow-shell,
        .rainbow-panel {
            position: relative;
            isolation: isolate;
        }

        .rainbow-shell::before,
        .rainbow-panel::before {
            content: "";
            position: absolute;
            inset: -2px;
            z-index: -1;
            border-radius: inherit;
            background: linear-gradient(120deg, var(--rose), var(--peach), var(--sun), var(--mint), var(--sky), var(--lilac), var(--rose));
            background-size: 240% 240%;
            animation: rainbow-flow 10s linear infinite;
        }

        .rainbow-shell::after {
            content: "";
            position: absolute;
            inset: 4px;
            z-index: -1;
            border-radius: calc(2rem - 4px);
            background: rgba(16, 28, 25, 0.96);
        }

        .rainbow-panel::after {
            content: "";
            position: absolute;
            inset: 2px;
            z-index: -1;
            border-radius: inherit;
            background: rgba(18, 31, 28, 0.94);
        }

        .soft-confetti {
            background-image:
                linear-gradient(90deg, rgba(255, 122, 162, 0.12) 0 10px, transparent 10px 24px),
                linear-gradient(90deg, rgba(255, 230, 109, 0.10) 0 8px, transparent 8px 28px),
                linear-gradient(90deg, rgba(124, 242, 189, 0.12) 0 12px, transparent 12px 30px),
                linear-gradient(90deg, rgba(105, 215, 255, 0.12) 0 9px, transparent 9px 26px);
            background-size: 180px 12px, 220px 10px, 200px 14px, 240px 12px;
            background-position: 0 0, 32px 24px, 70px 48px, 118px 72px;
        }

        @keyframes rainbow-flow {
            to {
                background-position: 220% center;
            }
        }

        .interpretation-content h2 {
            color: var(--sun);
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 0.04em;
            margin-top: 1.75rem;
            margin-bottom: 0.85rem;
            border-left: 4px solid var(--sky);
            padding-left: 0.9rem;
        }

        .interpretation-content h3 {
            color: var(--mint);
            font-size: 1.05rem;
            font-weight: 800;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .interpretation-content p {
            margin-bottom: 1rem;
            line-height: 1.85;
        }

        .interpretation-content strong {
            color: var(--sun);
        }
    </style>

,content:["勞君問我心中事","此意偏宜說向公","一片靈臺明似鏡","恰如明月正當空"]},{id:10,content:["櫝藏無價寶和珍","只管他鄉外處尋","好似將燈來覔火","不如安靜莫勞心"]},{id:11,content:["欲求好事喜非常","爭奈姻親只暫忙","畢竟到頭成好事","貴人接引貴人鄉"]},{id:12,content:["時臨否極泰當來","抖擻從君出暗埃","若遇卯寅佳信至","管教立志事和諧"]},{id:13,content:["自小生身富貴家","眼前萬事總奢華","要君賜受金魚袋","四海傳名足可誇"]},{id:14,content:["宛如仙鶴出樊籠","脫却羈縻處處通","南北東西無障碍","任君直上九霄中"]},{id:15,content:["觸人口氣最難吞","忽有災危禍到門","卵破巢空無宿處","深為穩便把心存"]},{id:16,content:["攢眉思慮暫時開","咫尺雲開見日來","宛似汙泥中片玉","良工一舉出塵埃"]},{id:17,content:["莫聽閑言與是非","晨昏只好念阿彌","若將妄語為真實","畫餅如何療得飢"]},{id:18,content:["金烏西墜兔東臨","日夜循環亘古今","僧道得之無不利","工商農士各開心"]},{id:19,content:["急水灘頭放艇時","狂風作浪欲何為","待他浪靜風停後","穩載船歸過不危"]},{id:20,content:["當春久雨喜初晴","玉兔金烏漸漸明","舊事已成新事遂","看看一跳入蓬瀛"]},{id:21,content:["陰陽道合總由天","女嫁男婚豈偶然","但看龍蛇堪運動","熊羆叶夢喜團圓"]},{id:22,content:["四郊田畝皆枯竭","久旱俄然三日霖","花菓草芽俱潤澤","始知一雨值千金"]},{id:23,content:["欲攀仙桂蟾宮去","豈慮天門不放開","謀望一般音信好","高人自送嶺頭來"]},{id:24,content:["不成鄰里不成家","水泡痴人似落花","若問君恩難得力","到頭畢竟事如蔴"]},{id:25,content:["過了憂危第幾重","從今再歷永無凶","寬心自有寬心計","得遇高人護聖功"]},{id:26,content:["上下傳來事總虛","天邊接得一封書","書中許我功名事","直待終時亦是無"]},{id:27,content:["一謀一用一番機","慮後疑前不敢為","時至自然逢貴助","銀牆鐵壁好安居"]},{id:28,content:["東方月上正蟬娟","頃刻雲遮月半邊","莫道圓時還又缺","須教缺處復重圓"]},{id:29,content:["寶劍光芒出匣時","匣中應不被塵欺","貴人親手提攜起","儘可防身更勿疑"]},{id:30,content:["勸君切莫向他求","似鶴飛來暗箭投","若去採薪蛇伏草","恐遭毒手也堪憂"]},{id:31,content:["清閑無事靜處坐","飢時吃飯困時臥","放下身心不用忙","必定不遭殃與禍"]},{id:32,content:["渺渺前途事可疑","石中藏玉有誰知","一朝良臣分明剖","始覺其中碧玉奇"]},{id:33,content:["石藏美玉在中心","得指何須向外尋","直待高人來剖析","恰如靈雨滌煩襟"]},{id:34,content:["出入行藏禮義恭","言必忠良聽必聰","心下了然俱洞徹","光明如日正當空"]},{id:35,content:["衣冠重整舊宿風","道是無功卻有功","掃卻當途荊棘碍","三人共議事相同"]},{id:36,content:["目前病訟不須憂","實地資財儘可求","恰好繫猿金脫鎖","得歸仙洞去來遊"]},{id:37,content:["欲問身安運泰時","風中燈燭不相宜","爭如收拾深堂坐","庶免光搖靜處期"]},{id:38,content:["鏡月當空出匣時","剎那雲霧暗迷離","寬心守待浮雲散","更改相宜可望為"]},{id:39,content:["天邊消息應難問","切莫私心強望求","若把石頭磨作鏡","精神枉費一時休"]},{id:40,content:["紅輪西墜兔東升","陰長陽消是兩形","若是女人占此卦","增添福祿稱心情"]},{id:41,content:["無限好事君須記","恰如認賊作為子","莫貪眼下有些甜","可慮他時還受苦"]},{id:42,content:["君垂恩澤潤無邊","覆禱祈禳沒黨偏","一切有情皆受用","均沾樂利得週全"]},{id:43,content:["天地交泰萬物新","自形自色自怡神","森羅萬象皆精彩","事事和諧得稱人"]},{id:44,content:["棋逢對手要藏機","黑白盤中未決時","到底欲知誰勝負","須教先著相機宜"]},{id:45,content:["溫柔自是勝強剛","積善于門太吉昌","若是有人占此卦","宛如止渴遇瓊漿"]},{id:46,content:["勸君耐守舊生涯","把定身心莫聽邪","直待有人輕著力","滿園枯木再開花"]},{id:47,content:["錦上添花色更鮮","運來祿馬喜雙全","時人莫訝功名晚","一舉登科四海傳"]},{id:48,content:["鵾鳥秋光化作鵬","遨翔得意盡飛騰","直沖萬里雲霄外","任是諸禽總不能"]},{id:49,content:["營圖萬事若冰澌","何必慳貪苦所為","只好靜心閑處坐","待他興變復奚疑"]},{id:50,content:["五湖四海盡行船","高掛風帆把舵堅","幸得順風隨所至","滿船寶貝稱心田"]},{id:51,content:["夏日初臨日正常","人皆愁惱熱非常","天公也解諸人意","故遣薰風特送涼"]},{id:52,content:["水中捉月費工夫","費盡功夫卻又無","莫信閑言併浪論","枉拋心力也難圖"]},{id:53,content:["失意翻成得意時","龍吟虎嘯兩相宜","青雲有路終須到","許我功名必可期"]},{id:54,content:["夢中得寶醒來無","應說巫山只是虛","若問婚姻幷病訟","別尋生路得相宜"]},{id:55,content:["相傳罔替子孫贊","衣祿豐盈富在天","金馬玉堂人快樂","飢時吃飯困時眠"]},{id:56,content:["澗小石粗流水響","力勞撐駕恐損傷","路須指出前江去","風靜潮平儘不妨"]},{id:57,content:["聞是聞非風過耳","好衣好祿日當空","君須記取他年事","汝意還同我意同"]},{id:58,content:["忠言善語君須記","莫向他方求別藝","勸君安守舊生涯","除卻有餘都不是"]},{id:59,content:["直上高樓去避身","四邊繞處是荊榛","誰知造物安排定","得意番成失意人"]},{id:60,content:["抱薪救火火增烟","燒卻三千及大千","若問營謀併出入","不如收拾莫憂燃"]},{id:61,content:["日上吟詩月下歌","逢場作戲笑呵呵","相逢會處難藏隱","喝啋齊聲嗹哩囉"]},{id:62,content:["晨昏全賴佛扶持","雖是逢危不見危","若得貴人來接引","此時福祿自相隨"]},{id:63,content:["昔日行船失了針","今朝依舊海中尋","若還尋得原針在","也費工夫也費心"]},{id:64,content:["譬若金鱗放碧漪","暗遭羅網四邊圍","思量無計翻身出","命到泉關苦獨悲"]},{id:65,content:["眼前歡喜未為歡","危不危兮安不安","割肉成瘡因甚事","不如守舊得安全"]},{id:66,content:["路險馬行人去遠","失群羊困虎相當","危灘船過風翻浪","春暮花殘天降霜"]},{id:67,content:["一條金秤等君情","無減無增無重輕","為是平生心正直","文章不識義皆明"]},{id:68,content:["門庭清吉夢禎祥","積善于門大吉昌","訟理婚成蠶又熟","病逢良藥得安康"]},{id:69,content:["冬來嶺上一枝梅","葉落枯枝總不摧","探得陽春消息近","依然還我做花魁"]},{id:70,content:["朝朝役役恰如蜂","飛來飛去西復東","春暮花殘無覔處","此身不戀舊叢中"]},{id:71,content:["誰知愛寵遇強徒","女子當年嫁二夫","自是一弓施兩箭","騎龍跨馬上安居"]},{id:72,content:["弄蜂須要求他蜜","只怕遭他尾上針","雖是眼前有異路","暗裏深藏荊棘林"]},{id:73,content:["春雷震起蟄中蟲","脫卻塵凡出舊墉","忽遇風雲交際處","自然變化得成龍"]},{id:74,content:["慵飛野鶴自投籠","欲舉鵬霄落陷中","南北東西混障碍","此身憔悴恨無窮"]},{id:75,content:["宛如抱虎過山前","戰戰兢兢膽碎寒","幸得山前逢妙手","方能保得一身安"]},{id:76,content:["魚龍混雜意和同","耐守寒潭未濟中","不覺一朝頭角聳","禹門一跳到天宮"]},{id:77,content:["夢中說夢獲多財","身外浮名總莫猜","水遠山遙難信定","貴人一指笑顏開"]},{id:78,content:["冷水來澆白雪洋","不寒不熱自溫涼","要行天下無他事","惟有中藏一藝強"]},{id:79,content:["虛空結愿結人緣","保得人安愿未還","得兔忘蹄真絕跡","敢將初誓謾輕瞞"]},{id:80,content:["直上高山去學仙","豈知一旦帝王宣","青天白日常明照","志在聲名四海傳"]},{id:81,content:["庭前葉落暮秋時","行客奔程勢若飛","謝得天公輕着力","順風相送寶船歸"]},{id:82,content:["炎炎烈火焰燒天","焰裡還生一朵蓮","到底永成根不壞","依然枝葉色新鮮"]},{id:83,content:["譬若初三四五蟾","半無半有未完全","須教十五良宵夜","到處清光到處圓"]},{id:84,content:["因名喪德不和同","切忌忙中變作凶","醉後不知何處去","青松影裡睡矇矓"]},{id:85,content:["重開山後藏前事","萬寶園中可再團","醉詠新詩添逸興","貴人引接上雲衢"]},{id:86,content:["春來花發映陽臺","萬里舟行進寶來","躍過禹門三級浪","恰如平地一聲雷"]},{id:87,content:["人行半嶺日啣山","峻險巉巖未可攀","仰望上天垂護佑","此身猶在太虛間"]},{id:88,content:["木雕一虎在山林","遠望威容意不禁","縱說不妨終可畏","此身如入大江心"]},{id:89,content:["出入營謀大吉昌","無瑕玉在石中藏","如今幸得高人指","獲寶從心喜不常"]},{id:90,content:["忽朝一信天下墀","寶貝船裝滿載歸","若問前程成底事","始終應得貴人提"]},{id:91,content:["好把愁眉須展開","大才大用薦將來","一條大路平如掌","凡有施為總稱懷"]},{id:92,content:["經商得利稱心懷","福祿榮華倍獲財","若問進身謀望事","秀才一舉狀元回"]},{id:93,content:["鸞鳳翎毛雨壓垂","此時應被雀輕欺","忽朝一日雲霄霽","依舊還教振羽衣"]},{id:94,content:["小人君子別賢愚","事有差訛合是非","琴遇知音當鼓操","爭如定靜得便宜"]},{id:95,content:["事業功勳暮與朝","榮華物態不勝饒","報君記取金雞鬪","福祿聲名價自超"]},{id:96,content:["巍巍寶塔不尋常","八面玲瓏盡放光","勸汝志心勤頂禮","天龍擁護降千祥"]},{id:97,content:["園林月色搖疎影","恍若鋪成滿地瓊","幾度兒童來收拾","豈知收拾總無成"]},{id:98,content:["經商出入事遲疑","恐惹閒愁與是非","如鳥飛投羅網陷","相看能有幾人知"]},{id:99,content:["等閑騎馬着鞭來","半有憂危半有財","似火方燒頭上屋","天教一雨蕩殃災"]},{id:100,content:["欲就東兮欲就西","逢人說事轉痴迷","登山不見神仙面","莫若歸休更勿提"]}],g0=[["Heaven opens, earth begins, and a good bond is formed.","The day is bright, the hour is kind, and all things may be whole.","To receive this oracle is no small matter.","Walk upright, and even the ruler's decree will favor you."],["The whale has not yet transformed and remains in rivers and lakes.","It is not yet allowed to rise beyond the blue waves.","One day its grand form will change.","Then one leap will carry it through the Dragon Gate."],["Through wind and rain you go, only to return again.","Your weary work is like a little swallow's labor.","After carrying mud to build a nest layer by layer,","In the end the nest may crumble back into mud."],["The broken mirror of love may become whole again.","A woman may seek a husband again, a man may marry anew.","From this time the household gate changes its fortune.","Blessings, prosperity, children, and descendants are added."],["With one hoe you dig the earth to seek a spring.","Work hard, and you will be first to find it.","Unexpectedly, you meet someone who understands you.","Hand in hand, you rise toward the blue sky."],["You cast yourself below the cliff to feed the tiger.","Only a true great-hearted person could do this.","Such self-giving is hard to meet again.","Nowhere under heaven is such a person easily found."],["Busy wandering brings danger after danger.","Dragging through water and mud, you still cross mountains.","If you seek another use in a distant place,","A thousand hills and rivers may keep you from returning."],["The pine and cypress were planted long ago in winter's cold.","Rain, snow, wind, and frost cannot destroy them.","In another day they will surely serve a great purpose.","They will become beams and pillars of achievement."],["You ask me about the matters in your heart.","This meaning is best spoken openly and fairly.","Your spiritual mirror is clear and bright.","Like the full moon shining in the empty sky."],["A priceless treasure lies stored inside the chest.","Yet you keep searching far away in other lands.","It is like carrying a lamp to look for fire.","Better be still and stop tiring your heart."],["You seek good fortune and joy beyond the usual.","Yet family ties may be busy only for a while.","In the end, the matter can still become good.","A noble helper leads you to a blessed place."],["When hardship reaches its end, peace begins to arrive.","Shake off the dust and step out of the dark.","When fine news comes in the tiger and hare months,","Your settled ambition will find harmony."],["From youth you were born into a house of wealth and rank.","Before your eyes, all things appear splendid.","You are granted the golden fish pouch of honor.","Your name may be praised throughout the four seas."],["Like a crane escaping from its cage,","Freed from bonds, you can move everywhere.","North, south, east, and west hold no barrier.","You may rise straight into the highest clouds."],["The hardest thing is swallowing offensive words.","Suddenly danger and trouble may reach your door.","When the egg breaks and the nest is empty, there is nowhere to stay.","Keep your heart steady and choose the safer way."],["Your furrowed worries open for a while.","The clouds nearby part, and the sun appears.","Like a piece of jade hidden in muddy earth,","A skilled hand lifts it out of the dust."],["Do not listen to idle talk and disputes.","Morning and evening, keep your mind on what is true.","If you treat false words as real,","How can a painted cake satisfy hunger?"],["The golden sun sinks west as the moon rises east.","Day and night have turned since ancient time.","Monks and seekers who receive this meet no disadvantage.","Merchants, workers, farmers, and scholars may all rejoice."],["A boat is launched at the head of rushing rapids.","Wild wind and waves rise for no good reason.","Wait until the waves quiet and the wind stops.","Then the boat can return safely without danger."],["After long spring rain, the first clear sky brings joy.","The moon and sun gradually shine brighter.","Old matters are completed, new matters succeed.","Soon one leap may carry you to the blessed isles."],["The harmony of yin and yang is arranged by heaven.","Marriage and union are never merely accidental.","Watch when dragon and serpent begin to move.","Dreams of bears and joy may bring reunion."],["All the fields around are dry and exhausted.","After long drought, three days of rain suddenly arrive.","Flowers, fruits, grasses, and sprouts are all refreshed.","Only then do you know one rain is worth a thousand pieces of gold."],["You wish to climb to the moon palace and pluck the immortal laurel.","Why worry that heaven's gate will not open?","For your plans, good news is on the way.","A person of stature sends help from the ridge."],["No neighborly bond, no household foundation.","A foolish person is like foam on water or fallen flowers.","If you ask whether favor can give strength,","In the end, matters tangle like hemp."],["You have passed through many layers of worry and danger.","From now on, further trials need not bring harm.","A peaceful heart has its own peaceful plan.","You meet a wise helper protected by sacred merit."],["Messages passed from above and below are all empty.","A letter arrives from the edge of the sky.","Inside it promises achievement and rank,","Yet even to the end, it may amount to nothing."],["Each plan and action contains a new turn of timing.","Looking ahead and doubting behind, you hesitate to act.","When the time arrives, noble help will naturally appear.","Then even silver walls and iron barriers become a safe home."],["The moon rises in the east, perfectly lovely.","In a moment, clouds cover half its face.","Do not say fullness must always become loss.","Let the missing part become round again."],["When the treasured sword shines as it leaves the sheath,","It should not be fooled by dust inside the case.","A noble person lifts it with their own hand.","It can protect you, so do not doubt."],["I advise you not to seek from others.","Like a crane flying in, struck by a hidden arrow.","If you go gathering firewood where snakes hide in grass,","You may meet a harmful hand and have reason to worry."],["Sit quietly in peace with nothing urgent to do.","Eat when hungry and sleep when tired.","Put down body and mind; there is no need to rush.","Then disaster and trouble will surely not reach you."],["The distant future looks doubtful and unclear.","Who knows there is jade hidden inside the stone?","Once a worthy minister clearly cuts it open,","Only then is the strange green jade revealed."],["Beautiful jade is hidden at the center of the stone.","With guidance, why search outside?","Wait until a wise person comes to open it.","Like sacred rain washing a troubled heart."],["In going out or staying hidden, keep courtesy and respect.","Speak with loyalty; listen with intelligence.","Your heart understands all things clearly.","Bright as the sun in the open sky."],["Robes and cap are arranged again in the old style.","It seems there is no merit, yet merit is there.","Sweep away the thorns blocking the road.","Three people consult together and agree."],["Current illness and lawsuits need not worry you.","Real wealth may still be sought on solid ground.","Like a monkey unchained from a golden lock,","It returns freely to the immortal cave."],["If you ask when body and fortune will be secure,","A lamp in the wind is not fitting.","Better gather yourself and sit in the inner hall.","Then the shaking light may find a quiet time."],["The mirror moon appears from its case in the sky.","In an instant, clouds and mist make it dark and confused.","Be patient and wait for the drifting clouds to scatter.","With change, the matter may become promising."],["News from the edge of heaven is hard to ask for.","Do not force private hopes too strongly.","If you try to grind a stone into a mirror,","Your energy will be wasted for a time."],["The red sun sinks west and the moon rises east.","Yin grows and yang fades in two forms.","If a woman receives this oracle,","Blessing and prosperity increase to her satisfaction."],["Remember this: not every good-looking thing is good.","It is like mistaking a thief for your own child.","Do not crave the small sweetness before your eyes.","Later, it may bring bitter suffering."],["Compassionate grace spreads without limit.","Prayers and protection show no partiality.","All living beings may receive benefit.","Joy and advantage are shared completely."],["Heaven and earth join in peace; all things become new.","Each form and color delights in itself.","The countless images of the world shine with life.","Everything becomes harmonious and satisfying."],["When chess meets an equal opponent, you must hide your strategy.","Black and white pieces remain undecided on the board.","If you want to know victory or defeat in the end,","You must first move at the right opportunity."],["Gentleness naturally overcomes harsh strength.","A house that gathers goodness is greatly blessed.","Whoever receives this oracle","Is like a thirsty person meeting sweet celestial water."],["I advise you to patiently guard your old livelihood.","Hold your mind steady and do not listen to crooked words.","Wait until someone gives a light helping hand.","Then the withered trees in the garden bloom again."],["Flowers added to brocade become even brighter.","When fortune arrives, rank and travel both bring joy.","Do not be surprised if achievement comes late.","One success in examination spreads fame across the seas."],["The kun bird in autumn light transforms into a great peng.","It soars with satisfaction and rises freely.","Straight through ten thousand miles beyond the clouds,","No ordinary bird can compare."],["Plans for all matters are like melting ice.","Why be stingy and greedy to the point of suffering?","It is better to sit quietly with a calm heart.","Wait for change; what is there to doubt?"],["Ships travel across the five lakes and four seas.","Raise the sail high and hold the rudder firm.","Luckily, a favorable wind carries you wherever you go.","A boat full of treasures satisfies the heart."],["As early summer arrives, the sun is strong.","People all worry because the heat is intense.","Heaven also understands everyone's feelings.","So it sends a fragrant breeze to bring coolness."],["Catching the moon in water wastes your effort.","After exhausting all effort, you still gain nothing.","Do not believe idle words and wild opinions.","Throwing away your strength in vain will not achieve the plan."],["When disappointment turns into satisfaction,","Dragon's cry and tiger's roar both become fitting.","There is a road to the blue clouds, and you will reach it.","Achievement and name can be expected."],["Treasure found in a dream is gone when you wake.","The clouds of Wu Mountain are only illusion.","If asking of marriage, illness, or lawsuits,","Seek another living path, and it will be more fitting."],["The family line is passed on and praised by descendants.","Clothing and food are abundant; wealth rests with heaven.","In golden halls and jade courts, people are happy.","Eat when hungry, sleep when tired."],["The stream is narrow, the stones are rough, and the water is noisy.","Hard rowing may bring damage and strain.","The path must be pointed toward the wider river ahead.","When wind is still and tide is calm, all is manageable."],["Hearing right and wrong is like wind passing the ear.","Good clothing and good fortune shine like the sun.","You should remember matters of future years.","Your intention will become the same as mine."],["Remember loyal words and kind advice.","Do not seek a different craft in another direction.","I advise you to keep your old livelihood.","Apart from what is already sufficient, the rest is not needed."],["You go straight up a high tower to hide yourself.","All around are thorns and brambles.","Who knew creation had arranged it this way?","Success may turn into disappointment."],["Carrying firewood to put out fire only adds smoke.","It burns through three thousand worlds and more.","If asking about plans, dealings, or travel,","Better gather things in and stop feeding the flame."],["By day you chant poems, by moonlight you sing.","At each occasion you play your part and laugh.","When people meet, nothing can be hidden.","Everyone cheers together in lively sound."],["Morning and evening depend entirely on Buddha's support.","Though danger appears, it does not become danger.","If a noble helper comes to guide you,","Blessing and prosperity follow at this time."],["In the past, a boat lost its needle at sea.","Today you still search in the ocean.","Even if the original needle is found,","It will take labor and a troubled heart."],["Like golden scales released into blue ripples,","A hidden net surrounds all four sides.","Thinking it over, there is no plan to escape.","When fate reaches the underworld gate, sorrow is lonely."],["Present joy is not yet true joy.","Is it dangerous or safe? It is hard to tell.","Why cut flesh and make a wound?","Better keep to the old way and gain safety."],["The road is dangerous; horse and traveler go far.","A lost sheep meets the tiger's strength.","A boat crosses risky rapids as wind overturns waves.","Late spring flowers fade, and frost falls from heaven."],["A golden scale balances your feelings.","Nothing is reduced, added, heavy, or light.","Because your heart has always been upright,","Even without elegant writing, the meaning is clear."],["The household is clear and auspicious; dreams bring good signs.","A house that accumulates goodness is greatly blessed.","Lawsuits settle, marriage succeeds, silkworms ripen.","Illness meets good medicine and gains peace."],["In winter on the ridge, one plum branch remains.","Leaves fall, yet the dry branch is not destroyed.","When news of spring comes near,","It returns again to be the flower chief."],["Day after day you work busily like a bee.","Flying here and there, west then east.","At spring's end, fallen flowers leave nowhere to search.","This body no longer clings to the old grove."],["Who knew beloved favor would meet a violent robber?","A woman in that year married two husbands.","One bow releases two arrows.","Riding dragon and horse, she reaches secure dwelling."],["If you play with bees, you must seek their honey.","But fear the needle at the end of their tail.","Though another road appears before your eyes,","Hidden thorns lie deep in the dark."],["Spring thunder wakes the insects in hiding.","They shed the dusty world and leave the old wall.","Suddenly meeting wind and clouds at the right moment,","They naturally transform and become dragons."],["A lazy wild crane throws itself into a cage.","Wanting to rise to the peng's sky, it falls into a trap.","North, south, east, and west are all obstructed.","This body is worn down with endless regret."],["As if carrying a tiger past the mountain front,","You tremble with fear and a chilled heart.","Luckily, before the mountain, a skillful hand appears.","Only then can your life be kept safe."],["Fish and dragons are mixed together in shared intention.","Patiently guard the cold pool before success arrives.","Without realizing it, one morning horns rise from the head.","One leap through the Dragon Gate reaches heaven."],["Dreaming inside a dream, you gain much wealth.","External fame is not worth guessing about.","Water is far and mountains distant; certainty is hard.","A noble person's guidance opens a smile."],["Cold water pours onto a field of white snow.","Neither cold nor hot, it becomes naturally mild.","To travel the world, no other matter is needed.","Only one strong skill must be kept within."],["Empty vows form connections with people.","Peace is protected, yet the vow is not repaid.","Once the rabbit is gained, the snare is forgotten without trace.","Do not lightly deceive your first promise."],["You go straight up the high mountain to study immortality.","Who knew one day the emperor would summon you?","The blue sky and bright sun shine constantly.","Your ambition is for fame across the four seas."],["Leaves fall before the courtyard in late autumn.","A traveler rushes forward as if flying.","Thanks to heaven's gentle helping force,","A following wind sends the treasure boat home."],["Blazing fire burns up to the sky.","Within the flames, a lotus is born.","In the end, its root remains unbroken.","Its branches and leaves are still fresh in color."],["Like the moon on the third, fourth, or fifth night,","Half absent, half present, not yet complete.","Wait until the good night of the fifteenth.","Then clear light becomes round everywhere."],["Because of name, virtue is lost and harmony breaks.","Beware turning busyness into misfortune.","After drunkenness, one does not know where one goes.","Under green pine shadows, sleep becomes confused."],["Behind the reopened mountain, former matters are hidden.","In the garden of ten thousand treasures, reunion is possible.","Drunkenly chanting new poems adds free delight.","A noble helper leads you up the cloud road."],["Spring comes and flowers bloom by the terrace.","A boat travels ten thousand miles bringing treasure.","Leaping over three Dragon Gate waves,","It is like thunder suddenly sounding on level ground."],["A person walks halfway up the ridge as the sun sinks behind the mountain.","Steep cliffs and dangerous rocks cannot yet be climbed.","Look up and ask heaven for protection.","This body still hangs in the vast emptiness."],["A wooden tiger is carved in the mountain forest.","From afar its fierce appearance still stirs fear.","Even if people say it cannot harm you, it remains frightening.","This body feels as if entering a great river."],["Entering and leaving for plans is greatly auspicious.","Flawless jade is hidden inside stone.","Now, fortunately, a wise person points it out.","Gaining the treasure, the heart is unusually glad."],["Suddenly one morning, a message reaches the world below.","A treasure-laden boat returns fully loaded.","If you ask what the future can become,","From start to finish, noble support will lift you."],["Open your worried brows.","Great talent will be recommended for great use.","A broad road lies flat as the palm.","Whatever you undertake can satisfy the heart."],["Business brings profit and satisfies the heart.","Blessing, rank, glory, and wealth are doubled.","If asking about advancement and plans,","The scholar returns as top graduate."],["Phoenix feathers droop under pressing rain.","For now, small birds may look down on it.","One morning when the clouds clear from the sky,","It will again shake out its feathered robe."],["Distinguish petty people, noble people, the worthy, and the foolish.","Matters contain mistakes and disputes of right and wrong.","When the qin meets one who understands its music, play it.","Better still, gain advantage through calm and stillness."],["Career and merit continue from dusk to dawn.","Glory and worldly abundance are beyond counting.","Remember the golden rooster's contest.","Blessing, rank, fame, and value rise above others."],["The towering jeweled pagoda is extraordinary.","Light shines from all eight sides.","I advise you to bow with a sincere heart.","Heavenly dragons protect you and send many blessings."],["Moonlight in the garden shakes sparse shadows.","It seems to spread jade across the ground.","Several times children come to gather it.","Who knows that gathering always comes to nothing?"],["Business and travel are hesitant matters.","They may invite idle worries and disputes.","Like a bird flying into a net and becoming trapped,","How many people can truly understand?"],["Casually riding in on a horse with whip in hand,","Half worry and danger, half wealth are present.","Like fire burning the roof above your head,","Heaven sends one rain to wash disaster away."],["Wanting to go east, wanting to go west,","You speak with others and become more confused.","Climbing the mountain, you do not see the immortal's face.","Better return, rest, and stop bringing it up."]],y0=i=>g0[i-1]||["","","",""];var v0={};/**
